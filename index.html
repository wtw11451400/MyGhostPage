    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #120808;
            color: #eee;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.9;
            min-height: 100vh;
            transition: all 0.8s ease;
            padding: 20px;
        }
        /* 开场动画遮罩 */
        #startLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s ease, transform 1.2s ease;
        }
        .loader-text {
            color: #ff5555;
            font-size: 26px;
            letter-spacing: 6px;
            animation: breath 2s infinite ease-in-out;
        }
        @keyframes breath {
            0%,100% {opacity:0.4; transform: scale(1);}
            50% {opacity:1; transform: scale(1.05);}
        }
        .fade-out {
            opacity: 0 !important;
            pointer-events: none;
            transform: scale(1.1);
        }
        /* 主容器 */
        .game-container {
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            background: #140a0a;
            padding: 35px 25px;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(180,0,0,0.45);
            border: 1px solid #551111;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .show-container {
            opacity: 1;
            transform: translateY(0);
        }
        .scene-title {
            color: #ff6060;
            font-size: 24px;
            margin-bottom: 22px;
            text-align: center;
            text-shadow: 0 0 12px rgba(255,80,80,0.6);
            opacity: 0;
            transition: opacity 0.7s ease;
        }
        .scene-title.show {opacity:1;}
        .scene-text {
            margin-bottom: 35px;
            font-size: 16px;
            min-height: 200px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .scene-text.show {opacity:1;}
        .choices {
            opacity: 0;
            transition: opacity 0.9s ease;
        }
        .choices.show {opacity:1;}
        .choice-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: #251212;
            color: #ddd;
            border: 1px solid #4a2222;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.4s ease;
        }
        .choice-btn:hover {
            background: #3a1a1a;
            border-color: #ff6666;
            color: #ff7777;
            letter-spacing: 1px;
        }
        .end-btn {
            background: #bb2222;
            border-color: #dd3333;
            color: #fff;
        }
        .end-btn:hover {
            background: #dd3333;
        }
        /* 场景氛围变色 */
        .mood-normal {background:#120808;}
        .mood-dark {background:#0b0505;}
        .mood-nervous {background:#1a0909;}
        .mood-mad {background:#1f0606;}
        .mood-sad {background:#0e0707;}
    </style>
</head>

        let currentScene = "start";
        const bodyBg = document.getElementById("bodyBg");
        const gameBox = document.getElementById("gameBox");
        const titleDom = document.getElementById("title");
        const textDom = document.getElementById("text");
        const choicesDom = document.getElementById("choices");

        // 开场动画
        setTimeout(() => {
            document.getElementById("startLoader").classList.add("fade-out");
            setTimeout(() => {
                gameBox.classList.add("show-container");
                updateScene();
            }, 800);
        }, 2500);

        function goToScene(sceneId) {
            if(sceneId === "restart") {
                currentScene = "start";
            } else {
                currentScene = sceneId;
            }
            // 清空渐入状态
            titleDom.classList.remove("show");
            textDom.classList.remove("show");
            choicesDom.classList.remove("show");
            // 延迟更新 制造情景切换动画感
            setTimeout(() => {
                updateScene();
            }, 600);
        }

        function updateScene() {
            const scene = scenes[currentScene];
            // 切换整体氛围背景
            bodyBg.className = scene.mood;

            titleDom.textContent = scene.title;
            textDom.textContent = scene.text;

            // 清空选项
            choicesDom.innerHTML = "";

            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                if(choice.next === "restart") {
                    btn.classList.add("end-btn");
                }
                btn.textContent = choice.text;
                btn.onclick = () => goToScene(choice.next);
                choicesDom.appendChild(btn);
            });

            // 文字逐块渐入
            setTimeout(()=>titleDom.classList.add("show"),150);
            setTimeout(()=>textDom.classList.add("show"),350);
            setTimeout(()=>choicesDom.classList.add("show"),550);
        }
