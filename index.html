<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #120808;
            color: #eee;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.9;
            min-height: 100vh;
            padding: 18px;
            position: relative;
            overflow-x: hidden;
        }
        .text-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .text-overlay span {
            position: absolute;
            font-size: 17px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }
        .text-overlay.red { color: #ff3a3a; text-shadow:0 0 6px #ff2222; }
        .text-overlay.black { color: #000; text-shadow:0 0 4px #440000; }
        .game-container {
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            background: #140a0a;
            padding: 30px 22px;
            border-radius: 14px;
            box-shadow: 0 0 45px rgba(190,0,0,0.5);
            border: 1px solid #5c1515;
            position: relative;
            z-index: 10;
        }
        .scene-title {
            color: #ff6363;
            font-size: 23px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,70,70,0.55);
        }
        .scene-text {
            margin-bottom: 32px;
            font-size: 15.5px;
            min-height: 220px;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #271313;
            color: #e2d0d0;
            border: 1px solid #4e2424;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14.8px;
            transition: all 0.35s ease;
        }
        .choice-btn:active {
            background: #401c1c;
            border-color: #ff5555;
            color: #ff8080;
        }
        .end-btn {
            background: #b82020;
            border-color: #d62e2e;
            color: #fff;
        }
        .mood-normal {background:#120808;}
        .mood-dark {background:#0a0404;}
        .mood-nervous {background:#190808;}
        .mood-mad {background:#1d0505;}
        .mood-sad {background:#0d0606;}
        .mood-love {background:#160707;}
        .love-word{color:#ff7777;font-weight:bold;margin-top:15px;line-height:2}
    </style>
</head>

        function spawnTextEffect(type, count = 6, customText = null) {
            const overlay = document.getElementById("textOverlay");
            const textPool = customText ? [customText] : (type === "red" ? sickTexts.redLove : sickTexts.blackMad);
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const span = document.createElement("span");
                    span.className = type === "red" ? "red" : "black";
                    span.textContent = textPool[Math.floor(Math.random() * textPool.length)];
                    span.style.left = Math.random() * 96 + "%";
                    span.style.top = Math.random() * 96 + "%";
                    overlay.appendChild(span);
                    setTimeout(() => span.style.opacity = 1, 15);
                    setTimeout(() => {
                        span.style.opacity = 0;
                        setTimeout(() => span.remove(), 700);
                    }, 6500);
                }, i * 130);
            }
        }

                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            decideBreak: {
                title: "决意分手 · 极致偏执禁锢",
                text: "你下定决心提出分手，彻底斩断二人之间所有情愫。这个决定彻底触碰他最后的底线，往日所有温柔温情全部消散，他不再伪装情绪，直白展现出内心所有极端想法，开始用各种方式限制你的出行、隔绝你的社交，将你慢慢圈禁在只属于他的小小天地之中。",
                mood: "mood-mad",
                loveEnding:"我可以包容你的所有小脾气，可以倾尽所有对你好，唯独不能接受你的离开。分手二字永远不许说出口，你生来就该依附于我，被我独自占有，哪怕禁锢一生，我也绝不会放你奔向任何人。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            slowAccept: {
                title: "日久情深 · 慢慢沦陷归属",
                text: "在长久贴心陪伴之下，你渐渐放下心中所有顾虑，心甘情愿接受他的心意，慢慢主动靠近他，接纳他所有好与不好。他欣喜万分，愈发珍惜来之不易的感情，收敛大半极端偏执，只将满满的温柔与真心尽数交付于你，二人安稳甜蜜相守相伴。",
                mood: "mood-love",
                loveEnding:"慢慢来没关系，我愿意花费数年光阴等候你走进我的心底，只要最后陪在你身边的人是我，所有等待全部值得，往后余生，朝朝暮暮，我都会倾尽一生爱意好好呵护你，不离不弃。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            finalRefuse: {
                title: "最终拒绝 · 爱意扭曲沉沦",
                text: "经过长久思考你依旧选择拒绝他的心意，彻底断绝所有相处可能。一次次的真心付出全部落空，他内心爱意彻底扭曲变质，从最初纯粹的喜欢，彻底转变为疯狂的占有执念，哪怕无法光明正大在一起，也要默默守在你身边，阻断所有接近你的异性。",
                mood: "mood-sad",
                loveEnding:"就算不能光明正大陪在你身边，我也会默默守在你的身后，斩断所有觊觎你的人，不让任何人夺走你的目光，我的爱意不求回应，只求能够一直默默注视着你，此生执念，永不消散。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            }
        };

        let currentScene = "start";
        const bodyBg = document.getElementById("bodyBg");
        const titleDom = document.getElementById("title");
        const textDom = document.getElementById("text");
        const choicesDom = document.getElementById("choices");

        function goToScene(sceneId, effect, customText) {
            if(sceneId === "restart") {
                currentScene = "start";
                document.getElementById("textOverlay").innerHTML = "";
            } else {
                currentScene = sceneId;
            }
            if(effect) spawnTextEffect(effect,6,customText);
            updateScene();
        }

        function updateScene() {
            const scene = scenes[currentScene];
            bodyBg.className = scene.mood;
            titleDom.textContent = scene.title;
            if(scene.loveEnding){
                textDom.innerHTML = scene.text + `<br><br><span class="love-word">【专属偏执爱意独白】<br>${scene.loveEnding}</span>`;
            }else{
                textDom.textContent = scene.text;
            }
            choicesDom.innerHTML = "";
            scene.choices.forEach(choice=>{
                const btn = document.createElement("button");
                btn.className = choice.next==="restart"?"choice-btn end-btn":"choice-btn";
                btn.textContent = choice.text;
                btn.onclick = ()=>goToScene(choice.next,choice.effect,choice.customText);
                choicesDom.appendChild(btn);
            })
        }
        updateScene();
    </script>
</body>
</html>
