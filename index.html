<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深夜鬼屋 - 互动故事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ddd;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            max-width: 600px;
            width: 100%;
            background: #111;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(100, 0, 0, 0.5);
            border: 1px solid #333;
        }
        .scene-title {
            color: #ff4444;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        .scene-text {
            margin-bottom: 30px;
            font-size: 16px;
            min-height: 120px;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .choice-btn:hover {
            background: #333;
            border-color: #ff4444;
            color: #ff4444;
        }
        .restart-btn {
            background: #ff4444;
            border-color: #ff4444;
            color: #fff;
        }
        .restart-btn:hover {
            background: #ff6666;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="scene-title" id="title">深夜鬼屋</h1>
        <p class="scene-text" id="text">你独自来到传说中的废弃鬼屋探险，推开门，一股阴冷的风扑面而来，里面一片漆黑。你要先做什么？</p>
        <div class="choices" id="choices">
            <button class="choice-btn" onclick="goToScene('flashlight')">拿出手机打开手电筒</button>
            <button class="choice-btn" onclick="goToScene('listen')">站在原地，仔细听里面的声音</button>
        </div>
    </div>

    <script>
        const scenes = {
            start: {
                title: "深夜鬼屋",
                text: "你独自来到传说中的废弃鬼屋探险，推开门，一股阴冷的风扑面而来，里面一片漆黑。你要先做什么？",
                choices: [
                    { text: "拿出手机打开手电筒", next: "flashlight" },
                    { text: "站在原地，仔细听里面的声音", next: "listen" }
                ]
            },
            flashlight: {
                title: "手电筒的光",
                text: "手电筒微弱的光勉强照亮前方，你看到地上有一串脚印，一直延伸到二楼楼梯口，脚印的方向...好像是朝着你过来的？",
                choices: [
                    { text: "跟着脚印上楼", next: "stairs" },
                    { text: "关掉手电，转身跑出门", next: "run" }
                ]
            },
            listen: {
                title: "奇怪的声音",
                text: "你屏住呼吸，听到二楼传来断断续续的脚步声，还有女人的哭声，声音越来越近，好像有人正在下楼。",
                choices: [
                    { text: "躲进旁边的衣柜里", next: "closet" },
                    { text: "对着楼梯大喊一声：谁在那里！", next: "shout" }
                ]
            },
            stairs: {
                title: "二楼走廊",
                text: "你跟着脚印上了楼，走廊尽头的房间门半开着，里面透出微弱的红光，脚印在门口消失了。",
                choices: [
                    { text: "推开门进去", next: "room" },
                    { text: "转身往楼下跑", next: "run" }
                ]
            },
            closet: {
                title: "衣柜里",
                text: "你躲进衣柜，透过缝隙看到一个穿白衣服的女人从楼梯走下来，她的脸苍白如纸，眼睛正盯着你躲的衣柜。",
                choices: [
                    { text: "屏住呼吸，一动不动", next: "still" },
                    { text: "突然推开衣柜冲出去", next: "run" }
                ]
            },
            shout: {
                title: "回声",
                text: "你的喊声在空屋里回荡，哭声和脚步声突然停了，四周死一般的寂静，下一秒，所有的声音都从你身后传来了。",
                choices: [
                    { text: "慢慢回头看", next: "look" },
                    { text: "头也不回地往外冲", next: "run" }
                ]
            },
            room: {
                title: "红光房间",
                text: "你推开门，看到房间里摆着一张旧床，床上躺着一个穿红衣服的娃娃，娃娃的眼睛正盯着你，嘴角在笑。",
                choices: [
                    { text: "伸手去碰娃娃", next: "touch" },
                    { text: "转身跑下楼", next: "run" }
                ]
            },
            still: {
                title: "安全？",
                text: "女人停在衣柜前，你听到她的指甲在衣柜门上划来划去的声音，过了一会儿，脚步声慢慢走远了。",
                choices: [
                    { text: "等了几分钟，打开衣柜出来", next: "escape" },
                    { text: "一直躲到天亮", next: "trapped" }
                ]
            },
            touch: {
                title: "娃娃的诅咒",
                text: "你的手刚碰到娃娃，它突然睁开了眼睛，红光瞬间照亮了整个房间，你感觉身体越来越冷，再也动不了了...",
                choices: [
                    { text: "游戏结束，重新开始", next: "restart" }
                ]
            },
            look: {
                title: "直面恐惧",
                text: "你慢慢回头，看到那个女人就站在你身后，她的脸离你只有几厘米，你闻到一股冰冷的霉味，她对着你笑了。",
                choices: [
                    { text: "游戏结束，重新开始", next: "restart" }
                ]
            },
            run: {
                title: "逃出生天",
                text: "你拼命往外跑，身后的脚步声一直在追你，你冲出大门，阳光照在身上，身后的鬼屋瞬间安静了下来，你活下来了！",
                choices: [
                    { text: "游戏结束，重新开始", next: "restart" }
                ]
            },
            escape: {
                title: "安全逃离",
                text: "你打开衣柜，发现那个女人不见了，你赶紧跑出鬼屋，直到跑到大街上才敢回头，鬼屋的门已经关上了，你安全了。",
                choices: [
                    { text: "游戏结束，重新开始", next: "restart" }
                ]
            },
            trapped: {
                title: "永远的衣柜",
                text: "你躲在衣柜里不敢出来，不知道过了多久，衣柜里越来越冷，你感觉自己的意识越来越模糊，再也没出去过...",
                choices: [
                    { text: "游戏结束，重新开始", next: "restart" }
                ]
            }
        };

        let currentScene = "start";

        function goToScene(sceneId) {
            if (sceneId === "restart") {
                currentScene = "start";
            } else {
                currentScene = sceneId;
            }
            updateScene();
        }

        function updateScene() {
            const scene = scenes[currentScene];
            document.getElementById("title").textContent = scene.title;
            document.getElementById("text").textContent = scene.text;
            
            const choicesDiv = document.getElementById("choices");
            choicesDiv.innerHTML = "";
            
            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                if (choice.next === "restart") {
                    btn.classList.add("restart-btn");
                }
                btn.textContent = choice.text;
                btn.onclick = () => goToScene(choice.next);
                choicesDiv.appendChild(btn);
            });
        }

        // 初始加载
        updateScene();
    </script>
</body>
</html>
