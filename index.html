            <button class="popup-close" onclick="closePop()">继续</button>
        </div>
    </div>

        <div class="text" id="gtext"></div>

<script>
    setTimeout(()=>{
        document.getElementById("opening").classList.add("hide");
        startGame();
    }, 2800);

    let now = "start";
    let love = 50;

    function createBarrage(text){
        let div = document.createElement("div");
        div.className = "barrage";
        div.innerText = text;
        div.style.top = Math.random() * 85 + "%";
        document.body.appendChild(div);
        setTimeout(()=>div.remove(),7000);
    }

    function showPop(text){
        document.getElementById("ptext").innerText = text;
        document.getElementById("popup").classList.add("show");
    }
    function closePop(){
        document.getElementById("popup").classList.remove("show");
    }

    function startGame(){
        render(now);
    }

    function render(key){
        let s = story[key];
        if(!s) return;
        document.getElementById("gtitle").innerText = s.title;
        document.getElementById("gtext").innerText = s.text + (s.diary ? "\n\n" + s.diary : "");
        let btnBox = document.getElementById("gbtns");
        btnBox.innerHTML = "";

        s.btns.forEach(b=>{
            let btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = b.txt;
            btn.onclick = ()=>{
                if(b.pop) showPop(b.pop);
                if(b.barrage) createBarrage(b.barrage);
                if(b.to === "restart"){
                    now = "start";
                }else{
                    now = b.to;
                }
                setTimeout(()=>render(now), 500);
            };
            btnBox.appendChild(btn);
        });
    }
