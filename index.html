<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>偏执爱意 · 病娇恋爱全篇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #120808;
            color: #eee;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.9;
            min-height: 100vh;
            padding: 18px;
            position: relative;
            overflow-x: hidden;
        }
        .game-container {
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            background: #140a0a;
            padding: 30px 22px;
            border-radius: 14px;
            box-shadow: 0 0 45px rgba(190,0,0,0.5);
            border: 1px solid #5c1515;
            position: relative;
            z-index: 10;
        }
        .scene-title {
            color: #ff6363;
            font-size: 23px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,70,70,0.55);
        }
        .scene-text {
            margin-bottom: 32px;
            font-size: 15.5px;
            min-height: 220px;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #271313;
            color: #e2d0d0;
            border: 1px solid #4e2424;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14.8px;
            transition: all 0.35s ease;
        }
        .choice-btn:active {
            background: #401c1c;
            border-color: #ff5555;
            color: #ff8080;
        }
        .end-btn {
            background: #b82020;
            border-color: #d62e2e;
            color: #fff;
        }
        .mood-normal {background:#120808;}
        .mood-dark {background:#0a0404;}
        .mood-nervous {background:#190808;}
        .mood-mad {background:#1d0505;}
        .mood-sad {background:#0d0606;}
        .mood-love {background:#160707;}
        .love-word{color:#ff7777;font-weight:bold;margin-top:15px;line-height:2}

        /* 弹出画面样式（修复版） */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .popup.show {
            display: flex;
        }
        .popup-box {
            background: #1b0b0b;
            border: 2px solid #ff5555;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 30px #ff000066;
        }
        .popup-text {
            font-size: 18px;
            color: #ff8888;
            line-height: 2;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .popup-close {
            padding: 12px 30px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body id="bodyBg">
    <!-- 弹出画面 -->
    <div class="popup" id="popup">
        <div class="popup-box">
            <div class="popup-text" id="popupText"></div>
            <button class="popup-close" onclick="closePopup()">继续阅读</button>
        </div>
    </div>

    <div class="game-container">
        <h1 class="scene-title" id="title"></h1>
        <p class="scene-text" id="text"></p>
        <div class="choices" id="choices"></div>
    </div>

    <script>
        let currentScene = "start";
        let pendingScene = null;

        // 弹出画面（修复：强制更新文字，避免空文本卡住）
        function showPopup(text) {
            const popupTextEl = document.getElementById("popupText");
            if (popupTextEl) {
                popupTextEl.innerText = text || "";
            }
            document.getElementById("popup").classList.add("show");
        }
        function closePopup() {
            document.getElementById("popup").classList.remove("show");
            if (pendingScene) {
                currentScene = pendingScene;
                pendingScene = null;
                updateScene();
            }
        }

        const scenes = {
            start: {
                title: "序章 · 暮色初遇",
                text: "傍晚微风拂过校园林荫道，夕阳染红半边天际，细碎金光散落满地，你独自一人慢悠悠漫步散心，心绪悠然闲适。前方梧桐树下静静伫立着一位少年，清隽侧脸在落日余晖下格外动人，自你踏入这片区域开始，他的视线便牢牢黏在你的身上，分毫未曾移动半分。",
                mood: "mood-normal",
                choices: [
                    { text: "主动停下脚步轻声回应", next: "meetTalk1", popup: "终于……等到你愿意看向我了。" },
                    { text: "低头腼腆闪躲不敢对视", next: "meetTalk2" },
                    { text: "神色冷淡径直侧身走过", next: "meetCold", popup: "你敢无视我……很好，我记住了。" },
                    { text: "心生好奇主动上前搭话", next: "meetChat" }
                ]
            },
            meetTalk1: {
                title: "初遇交谈 · 温柔试探",
                text: "你停下脚步轻声作答，少年澄澈眼眸之中瞬间漾开满满的温柔笑意，语调轻柔舒缓，细细询问着你的日常作息、兴趣喜好与生活琐事。",
                mood: "mood-love",
                choices: [
                    { text: "坦然诉说自己全部喜好", next: "knowMore", popup: "你的一切……我都会牢牢刻在心里。" },
                    { text: "简单敷衍不愿过多交谈", next: "perfunctory", popup: "你在敷衍我……是吗？" },
                    { text: "主动反问喜好拉近关系", next: "mutualTalk" },
                    { text: "借口有事匆忙抽身离开", next: "wantLeave" }
                ]
            },
            meetTalk2: {
                title: "腼腆相望 · 心生悸动",
                text: "你脸颊微红低头垂眸，不敢与眼前少年对视，这般羞怯模样让他心底的喜欢愈发浓烈。",
                mood: "mood-love",
                choices: [
                    { text: "鼓起勇气抬头直视双眸", next: "eyeLove", popup: "你的眼睛……真好看，我好想一直看着。" },
                    { text: "依旧低头沉默不言不语", next: "silentShy" },
                    { text: "小声低语简单回应几句", next: "softReply" },
                    { text: "慌乱失神转身快步逃离", next: "flusterRun", popup: "跑什么？你以为……跑得掉吗？" }
                ]
            },
            meetCold: {
                title: "刻意疏离 · 暗生执念",
                text: "你神色淡漠无视对方，径直从他身旁擦肩而过。少年脸上温润的笑意瞬间消散殆尽，周身空气骤然变冷，阴冷压抑的气息缓缓蔓延开来。",
                mood: "mood-nervous",
                choices: [
                    { text: "行走途中忍不住回头张望", next: "lookBack", popup: "你还是在意我的……对吧？" },
                    { text: "全然无视头也不回向前走", next: "ignoreAll", popup: "没关系，我会让你再也离不开我。" },
                    { text: "内心慌乱不安放慢脚步", next: "uneasySlow" }
                ]
            },
            meetChat: {
                title: "主动搭话 · 情愫升温",
                text: "你鼓起勇气主动上前开启话题，少年先是微微一怔，随即展露满心欢喜的神情，热情细致回应你的每一句话语。",
                mood: "mood-love",
                choices: [
                    { text: "相约闲暇之时一同散步", next: "makeAnAppointment", popup: "和我约定……太好了，真的太好了。" },
                    { text: "闲谈结束礼貌道别分开", next: "politePart", popup: "这么快就想走吗……我还没看够你。" },
                    { text: "委婉询问对方感情状态", next: "askSingle" },
                    { text: "提议结伴沿街漫步吹风", next: "walkTogether" }
                ]
            },
            eyeLove: {
                title: "目光相融 · 心动沦陷",
                text: "你鼓起勇气抬眸与他四目相对，清澈眼眸两两相撞的瞬间，周遭一切仿佛尽数静止。",
                mood: "mood-love",
                choices: [
                    { text: "深陷心动彻底沉沦其中", next: "heartFall", popup: "就这样……看着我，只准看着我。" },
                    { text: "慌乱羞涩连忙移开视线", next: "shyAwayEye" },
                    { text: "镇定从容依旧静静对视", next: "calmStare" }
                ]
            },
            heartFall: {
                title: "心意沉沦 · 正式深情表白",
                text: "温柔夜色笼罩街巷，街边灯火朦胧柔和，少年将你带到僻静无人的河畔晚风轻轻吹动发丝，氛围感十足。",
                mood: "mood-love",
                choices: [
                    { text: "满心欢喜点头答应交往", next: "agreeLove", popup: "你是我的……从今天起，完完全全是我的。" },
                    { text: "内心犹豫迟迟无法决断", next: "hesitateLove", popup: "没关系，我可以等……等到你属于我。" },
                    { text: "委婉拒绝只想维持朋友", next: "refuseConfess" },
                    { text: "羞涩沉默默认接受心意", next: "silentAgree" }
                ]
            },
            agreeLove: {
                title: "确定关系 · 偏执宠爱开启",
                text: "你点头应允和他相恋，少年当即伸手将你紧紧拥入怀中，力道温柔却带着不容挣脱的占有感，恨不得将你融入骨血之中。",
                mood: "mood-love",
                choices: [
                    { text: "沉溺偏爱心甘情愿顺从", next: "obeyAll", popup: "真乖……这样才是我的好孩子。" },
                    { text: "反感束缚渴望私人空间", next: "needSpace", popup: "私人空间？你不需要那种东西。" },
                    { text: "轻声劝说希望他放宽管束", next: "remindHim" },
                    { text: "沉浸甜蜜无视潜在隐患", next: "immerseSweet" }
                ]
            },
            refuseConfess: {
                title: "拒绝告白 · 偏执彻底爆发",
                text: "你明确拒绝他的告白，只想维持平淡普通的朋友关系。少年脸上所有温柔尽数碎裂消散，眼底翻涌着阴郁疯狂的情绪，周身氛围冰冷刺骨。",
                mood: "mood-mad",
                choices: [
                    { text: "察觉异常慌忙转身逃离", next: "rushAway", popup: "逃吧……随便你逃，我一定会抓到你。" },
                    { text: "心生畏惧主动低头服软", next: "fearSoft", popup: "早这样乖乖听话，不就好了吗。" },
                    { text: "据理力争坚守自身想法", next: "argueFirm" }
                ]
            },
            obeyAll: {
                title: "全然顺从 · 温柔囚笼深陷",
                text: "你顺从他所有要求，心甘情愿接受他的偏爱与管束。他倾尽所有温柔悉心照料你的衣食住行，将你呵护得无微不至。",
                mood: "mood-dark",
                loveEnding: "我倾尽世间所有温柔只为将你安稳困住，你的世界之中只需要存有我一人便足够，不必接触旁人，不必追寻自由，安心依偎在我怀中。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            needSpace: {
                title: "渴求自由 · 矛盾冲突爆发",
                text: "你渴望拥有独属于自己的私人空间，厌烦无时无刻的管束束缚，二人之间矛盾争执频频爆发。",
                mood: "mood-nervous",
                choices: [
                    { text: "心软释怀再次选择妥协", next: "softForgive", popup: "别离开我……求你了。" },
                    { text: "心灰意冷决意彻底分开", next: "decideBreak", popup: "分手？你觉得……我会同意吗？" },
                    { text: "彼此冷静暂时断开联络", next: "calmBreakContact" }
                ]
            },
            rushAway: {
                title: "仓皇逃离 · 全网搜寻追捕",
                text: "你察觉到他情绪失控之后慌忙逃离，本以为能够彻底摆脱这份偏执纠缠。可自此之后无论你去往何处，总能轻易撞见他的身影。",
                mood: "mood-mad",
                loveEnding: "从你狠心拒绝我的那一刻开始，我便早已下定决心绝不放手，天地辽阔也容不下你的肆意逃离。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            decideBreak: {
                title: "决意分手 · 极致偏执禁锢",
                text: "你下定决心提出分手，斩断二人之间所有情感牵绊。这句话彻底触碰了他内心最后的底线。",
                mood: "mood-mad",
                loveEnding: "我能够包容你所有小脾气，倾尽所有真心待你，唯独万万不能接受你的离开。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            slowAccept: {
                title: "日久情深 · 慢慢沦陷归属",
                text: "在日复一日贴心温柔的陪伴之下，你渐渐放下内心所有顾虑与防备，心甘情愿接纳他的满腔心意。",
                mood: "mood-love",
                loveEnding: "慢慢来从来都没关系，我甘愿耗费漫长岁月静静等候你走进我的心底，只要最后陪在你身边的人是我。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            },
            silentAgree: {
                title: "沉默接受 · 甜蜜热恋开启",
                text: "你面颊羞涩沉默不语，这般模样已然默认接纳了他的告白心意。",
                mood: "mood-love",
                loveEnding: "你的沉默便是给予我最好的答复，往后漫长岁月之中，我会用尽全部行动证明我的真心爱意。",
                choices: [{ text: "重新开启全新剧情", next: "restart" }]
            }
        };

        function goToScene(sceneId, popupText) {
            if (sceneId === "restart") {
                currentScene = "start";
                updateScene();
                return;
            }
            if (popupText) {
                pendingScene = sceneId;
                showPopup(popupText);
            } else {
                currentScene = sceneId;
                updateScene();
            }
        }

        function updateScene() {
            const scene = scenes[currentScene];
            const bodyBg = document.getElementById("bodyBg");
            const titleDom = document.getElementById("title");
            const textDom = document.getElementById("text");
            const choicesDom = document.getElementById("choices");

            bodyBg.className = scene.mood;
            titleDom.textContent = scene.title;
            if (scene.loveEnding) {
                textDom.innerHTML = scene.text + `<br><br><span class="love-word">【专属偏执爱意独白】<br>${scene.loveEnding}</span>`;
            } else {
                textDom.textContent = scene.text;
            }
            choicesDom.innerHTML = "";
            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = choice.next === "restart" ? "choice-btn end-btn" : "choice-btn";
                btn.textContent = choice.text;
                btn.onclick = () => goToScene(choice.next, choice.popup);
                choicesDom.appendChild(btn);
            });
        }

        // 页面加载完成后初始化
        window.onload = function() {
            updateScene();
        }
    </script>
</body>
</html>
