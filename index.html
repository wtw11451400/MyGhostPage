<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>偏执爱意 · 终极完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #120808;
            color: #eee;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.9;
            min-height: 100vh;
            padding: 18px;
            position: relative;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }
        body::before{
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, rgba(255,40,40,0.15));
            pointer-events: none;
            z-index: 1;
            animation: lightBeat 4s infinite ease-in-out;
        }
        @keyframes lightBeat{
            0%,100%{opacity:0.3;}
            50%{opacity:0.7;}
        }

        .heart-left, .heart-right{
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 32px;
            color: #ff3344;
            text-shadow: 0 0 15px #ff0011;
            z-index: 5;
            user-select: none;
            opacity: 0.8;
        }
        .heart-left{ left:20px; }
        .heart-right{ right:20px; }

        .heart-beat-normal{ animation: heartSoft 1.6s infinite; }
        .heart-beat-angry{ animation: heartFast 0.9s infinite; }
        @keyframes heartSoft{
            0%,100%{transform:translateY(-50%) scale(1); opacity:0.7;}
            50%{transform:translateY(-50%) scale(1.15); opacity:1;}
        }
        @keyframes heartFast{
            0%,100%{transform:translateY(-50%) scale(1); opacity:0.9;}
            50%{transform:translateY(-50%) scale(1.5); opacity:1; text-shadow:0 0 30px red;}
        }

        .game-container {
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
            background: #140a08;
            padding: 30px 22px;
            border-radius: 14px;
            box-shadow: 0 0 45px rgba(190,0,0,0.5);
            border: 1px solid #5c1515;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }
        .scene-title {
            color: #ff6363;
            font-size: 23px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,70,70,0.55);
            animation: titleFlick 3s infinite alternate;
        }
        @keyframes titleFlick{
            from{text-shadow:0 0 10px #ff4444;}
            to{text-shadow:0 0 20px #ff0000,0 0 30px #ff2222;}
        }
        .scene-text {
            margin-bottom: 32px;
            font-size: 15.5px;
            min-height: 200px;
            transition: color 0.5s ease;
            white-space: pre-line;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #271313;
            color: #e2d0d0;
            border: 1px solid #4e2424;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14.8px;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .choice-btn::after{
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,transparent,rgba(255,80,80,0.2),transparent);
            transition: left 0.5s ease;
        }
        .choice-btn:hover::after{ left: 100%; }
        .choice-btn:hover {
            background: #331818;
            border-color: #ff6666;
            color: #ffaaaa;
            letter-spacing: 1px;
        }
        .end-btn {
            background: #b82020;
            border-color: #d62e2e;
            color: #fff;
        }

        .mood-normal {background:#120808;}
        .mood-dark {background:#0a0408;}
        .mood-nervous {background:#190808;}
        .mood-mad {background:#1d0808;}
        .mood-sad {background:#0d0808;}
        .mood-love {background:#160808;}

        .diary{
            border-left:3px solid #ff4444;
            padding:15px 18px;
            margin-top:25px;
            color:#ffcccc;
            font-style:italic;
            line-height:2;
            background:rgba(255,20,30,0.08);
            border-radius:0 8px 8px 0;
            animation: diaryFade 1.2s ease;
        }
        @keyframes diaryFade{
            from{opacity:0;transform: translateX(-10px);}
            to{opacity:1;transform: translateX(0);}
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .popup.show {
            display: flex;
            animation: popOpen 0.4s ease;
        }
        @keyframes popOpen{
            from{opacity:0;transform:scale(0.8);}
            to{opacity:1;transform:scale(1);}
        }
        .popup-box {
            background: #1b0b0b;
            border: 2px solid #ff5555;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 30px #ff000066;
        }
        .popup-text {
            font-size: 18px;
            color: #ff8888;
            line-height: 2;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .popup-close {
            padding: 12px 30px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .popup-close:hover{
            background: #ff2222;
            box-shadow: 0 0 15px #ff3333;
        }

        .yandere-text {
            color: #ff4444;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0000;
            animation: yandereShake 0.5s ease-in-out infinite alternate;
        }
        @keyframes yandereShake {
            from{transform: translateX(0);}
            to{transform: translateX(3px);}
        }
    </style>
</head>
<body>
    <div class="heart-left" id="heartLeft">❤</div>
    <div class="heart-right" id="heartRight">❤</div>

    <div class="popup" id="popup">
        <div class="popup-box">
            <div class="popup-text" id="popupText"></div>
            <button class="popup-close" onclick="closePopup()">继续</button>
        </div>
    </div>

    <div class="game-container">
        <h1 class="scene-title" id="title"></h1>
        <p class="scene-text" id="text"></p>
        <div id="choices"></div>
    </div>

    <script>
        let currentScene = "start";
        let pendingScene = null;
        let loveValue = 50;
        let senseValue = 60;
        let dangerValue = 30;

        function updateHeartAnimation(){
            let l = document.getElementById("heartLeft");
            let r = document.getElementById("heartRight");
            if(loveValue < 30){
                l.className = "heart-left heart-beat-angry";
                r.className = "heart-right heart-beat-angry";
            }else{
                l.className = "heart-left heart-beat-normal";
                r.className = "heart-right heart-beat-normal";
            }
        }

        function showPopup(t){
            document.getElementById("popupText").innerText = t;
            document.getElementById("popup").classList.add("show");
        }
        function closePopup(){
            document.getElementById("popup").classList.remove("show");
            if(pendingScene){
                currentScene = pendingScene;
                pendingScene = null;
                updateScene();
            }
        }

                    {text:"询问她的名字",next:"chat2",love:10,sense:-2,danger:0,popup:"❤️ 姐姐内心：你想知道我的名字？你开始在意我了，真好。"}

        function restartGame(){
            loveValue=50; senseValue=60; dangerValue=30;
            currentScene="start"; updateScene();
        }

        function updateScene(){
            const s = scenes[currentScene];
            document.body.className = s.mood;
            document.getElementById("title").innerText = s.title;
            document.getElementById("text").innerText = s.text + (s.diary ? "\n\n"+s.diary : "");
            updateHeartAnimation();

            let box = document.getElementById("choices");
            box.innerHTML = "";
            s.choices.forEach(c=>{
                let b = document.createElement("button");
                b.className = c.next=="restartGame" ? "choice-btn end-btn" : "choice-btn";
                b.innerText = c.text;
                b.onclick = ()=>{
                    if(c.love!==undefined) loveValue=Math.max(0,Math.min(100,loveValue+c.love));
                    if(c.sense!==undefined) senseValue=Math.max(0,Math.min(100,senseValue+c.sense));
                    if(c.danger!==undefined) dangerValue=Math.max(0,Math.min(100,dangerValue+c.danger));

                    if(c.popup){ pendingScene=c.next; showPopup(c.popup); }
                    else{ currentScene=c.next; updateScene(); }
                };
                box.appendChild(b);
            });
        }

        window.onload=()=>{ updateScene(); }
    </script>
