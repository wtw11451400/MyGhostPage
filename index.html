<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>偏执爱意 · 完美稳定版</title>
    <style>
        /* 全屏开场动画 */
        .opening {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 1.2s ease;
        }
        .opening.hide {
            opacity: 0;
            pointer-events: none;
        }
        .opening-heart {
            font-size: 70px;
            color: #ff3344;
            animation: beat 1.4s infinite alternate;
            margin-bottom: 20px;
        }
        @keyframes beat {
            0% { transform: scale(1); text-shadow: 0 0 10px red; }
            100% { transform: scale(1.3); text-shadow: 0 0 30px red; }
        }
        .opening-title {
            font-size: 32px;
            color: #ff4444;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0000;
            margin-bottom: 10px;
        }
        .opening-tip {
            font-size: 16px;
            color: #ffaaaa;
            opacity: 0.8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #120808;
            color: #eee;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.9;
            min-height: 100vh;
            padding: 15px;
            transition: background 0.8s ease;
            overflow-x: hidden;
        }
        .game-box {
            max-width: 600px;
            margin: 0 auto;
            background: #140a08;
            padding: 25px 20px;
            border-radius: 12px;
            border: 1px solid #5c1515;
            box-shadow: 0 0 40px rgba(190,0,0,0.4);
        }
        .title {
            color: #ff6363;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff4444;
        }
        .text {
            font-size: 16px;
            min-height: 220px;
            margin-bottom: 25px;
            white-space: pre-line;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #271313;
            color: #e2d0d0;
            border: 1px solid #4e2424;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #331818;
            border-color: #ff6666;
            color: #ffaaaa;
        }

        /* 弹窗 */
        .popup {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding:20px;
        }
        .popup.show {
            display: flex;
        }
        .popup-inner {
            background: #1b0b0b;
            border: 2px solid #ff5555;
            border-radius: 12px;
            max-width: 450px;
            width:100%;
            padding:30px;
            text-align: center;
        }
        .popup-text {
            font-size: 17px;
            color: #ff8888;
            margin-bottom:25px;
            line-height:1.8;
        }
        .popup-close {
            padding:10px 25px;
            background:#ff4444;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        /* 心跳装饰 */
        .heart {
            position: fixed;
            top:50%;
            font-size:30px;
            color:#ff3344;
            z-index: -1;
            opacity:0.7;
            animation: hb 1.6s infinite;
        }
        .heart.left { left:15px; }
        .heart.right { right:15px; }
        @keyframes hb {
            0%,100%{transform:translateY(-50%) scale(1);}
            50%{transform:translateY(-50%) scale(1.2);}
        }
    </style>
</head>

<body>
    <!-- 开场动画 -->
    <div class="opening" id="opening">
        <div class="opening-heart">❤️</div>
        <div class="opening-title">偏执爱意</div>
        <div class="opening-tip">无尽缠绵 · 即将开始</div>
    </div>

    <div class="heart left">❤</div>
    <div class="heart right">❤</div>

    <!-- 弹窗 -->
    <div class="popup" id="popup">
        <div class="popup-inner">
            <div class="popup-text" id="ptext"></div>
            <button class="popup-close" onclick="closePop()">继续</button>
        </div>
    </div>

    <!-- 游戏主体 -->
    <div class="game-box">
        <div class="title" id="gtitle"></div>
        <div class="text" id="gtext"></div>
        <div id="gbtns"></div>
    </div>

<script>
    // 开场动画自动关闭
    setTimeout(()=>{
        document.getElementById("opening").classList.add("hide");
        startGame();
    }, 3200);

    let now = "start";
    let love = 50;
    let wait = null;

    // 剧情数据（完整无BUG）
    const story = {
        start:{
            title:"序章·暮色初遇",
            text:"黄昏晚风拂过整片校园，梧桐枝叶轻轻摇晃，洒落满地细碎金光。你独自一人漫步在幽静林荫小道，道路尽头的老树下，一位女子静静伫立，目光牢牢锁定在你身上，眼底翻涌着绵长爱意与执念。",
            btns:[
                {txt:"主动上前搭话",to:"meet1",pop:"❤️ 终于等到你靠近我"},
                {txt:"视而不见路过",to:"cold1",pop:"⚠️ 你在刻意躲开我吗"},
                {txt:"羞赧低头慢行",to:"shy1",pop:"❤️ 你害羞的样子真可爱"},
                {txt:"驻足静静看着她",to:"chat1",pop:"❤️ 你愿意注视我，我很开心"}
            ]
        },
        meet1:{
            title:"初次温情交谈",
            text:"你主动开口，女子眉眼瞬间温柔，缓步向你走来，周身带着淡淡香气，语气温柔，却藏着不容拒绝的占有欲。",
            btns:[
                {txt:"温柔回应",to:"talkA",pop:"❤️ 你的声音真好听"},
                {txt:"拉开距离",to:"coldA",pop:"⚠️ 你在害怕我吗"},
                {txt:"询问来历",to:"chatA",pop:"❤️ 你想了解我，我很欢喜"},
                {txt:"准备离开",to:"leaveA",pop:"⚠️ 刚见面就要走吗"}
            ]
        },
        cold1:{
            title:"刻意疏离",
            text:"你径直走过，她脸上的笑容瞬间消失，空气变得冰冷，脚步声轻轻跟在你身后，被紧盯的压抑感扑面而来。",
            btns:[
                {txt:"停下道歉",to:"talkA",pop:"❤️ 我不怪你，只要你回头"},
                {txt:"加快逃离",to:"coldB",pop:"⚠️ 你逃不掉的"},
                {txt:"不知所措",to:"shyA",pop:"❤️ 别怕，我不会伤害你"},
                {txt:"冷漠对视",to:"angryA",pop:"⚠️ 你的眼神伤了我的心"}
            ]
        },
        shy1:{
            title:"羞涩心动",
            text:"你低下头，脸颊微红，脚步放慢。她轻声笑了起来，慢慢靠近你，温热气息扑面而来，语气满是宠溺。",
            btns:[
                {txt:"抬头对视",to:"talkA",pop:"❤️ 你的眼睛真好看"},
                {txt:"更害羞了",to:"shyB",pop:"❤️ 可爱得让我心动"},
                {txt:"小声回应",to:"chatA",pop:"❤️ 你的声音软软的"},
                {txt:"转移视线",to:"coldA",pop:"⚠️ 不许躲开我"}
            ]
        },
        chat1:{
            title:"目光交织",
            text:"你停下看她，她满心欢喜，主动走到你面前，直白诉说对你的好感，毫不掩饰浓烈的爱意。",
            btns:[
                {txt:"默认认同",to:"talkA",pop:"❤️ 你是属于我的"},
                {txt:"收回目光",to:"coldA",pop:"⚠️ 你在逃避吗"},
                {txt:"开启话题",to:"chatA",pop:"❤️ 想和你一直聊下去"},
                {txt:"敷衍点头",to:"leaveA",pop:"⚠️ 你不想理我吗"}
            ]
        },
        talkA:{
            title:"深入交谈",
            text:"你们慢慢熟悉，畅谈心事与日常，她认真听着每一句话，表面温柔，内心早已规划好把你留在身边。",
            btns:[
                {txt:"诉说心事",to:"meet1",pop:"❤️ 谢谢你信任我"},
                {txt:"有所保留",to:"coldA",pop:"⚠️ 你对我有所隐瞒"},
                {txt:"关心她",to:"chatA",pop:"❤️ 被你关心好幸福"},
                {txt:"准备离开",to:"leaveA",pop:"⚠️ 我舍不得你走"}
            ]
        },
        coldA:{
            title:"隔阂渐生",
            text:"你的冷淡让她难过，温柔褪去，眉宇间多了偏执与不安，占有欲越来越强。",
            btns:[
                {txt:"主动缓和",to:"talkA",pop:"❤️ 你还是在意我的"},
                {txt:"沉默不语",to:"coldB",pop:"⚠️ 沉默让我很痛苦"},
                {txt:"轻声安抚",to:"shyB",pop:"❤️ 只有你能安抚我"},
                {txt:"保持距离",to:"angryA",pop:"⚠️ 我的耐心快耗尽了"}
            ]
        },
        chatA:{
            title:"轻松闲谈",
            text:"气氛轻松愉快，她看你的眼神越来越温柔，越来越确定，不能失去你。",
            btns:[
                {txt:"继续聊天",to:"talkA",pop:"❤️ 和你聊天最开心"},
                {txt:"一起散步",to:"meet1",pop:"❤️ 想和你并肩走下去"},
                {txt:"道别离开",to:"leaveA",pop:"⚠️ 真的不想和你分开"},
                {txt:"问她心意",to:"shy1",pop:"❤️ 我的心里全都是你"}
            ]
        },
        leaveA:{
            title:"仓促离别",
            text:"你打算离开，她想伸手挽留，却又收回，静静看着你的背影，孤寂与执念越来越深。",
            btns:[
                {txt:"不忍回头",to:"talkA",pop:"❤️ 我就知道你舍不得"},
                {txt:"毅然离开",to:"coldB",pop:"⚠️ 你会后悔离开我"},
                {txt:"挥手告别",to:"shyA",pop:"❤️ 期待下次见面"},
                {txt:"径直走远",to:"angryA",pop:"⚠️ 你伤透了我的心"}
            ]
        },
        shyA:{
            title:"慌乱无措",
            text:"你手足无措，她所有怒气都消失了，只剩下怜惜，轻轻靠近，温柔安抚你。",
            btns:[
                {txt:"平复心情",to:"talkA",pop:"❤️ 别怕，有我在"},
                {txt:"依旧紧张",to:"shyB",pop:"❤️ 你紧张的样子好可爱"},
                {txt:"主动说话",to:"chatA",pop:"❤️ 你主动的样子真迷人"},
                {txt:"后退躲开",to:"coldA",pop:"⚠️ 不要再躲着我了"}
            ]
        },
        coldB:{
            title:"执意逃离",
            text:"你拼命逃跑，她挡在你面前，温柔消失，眼神偏执：你绝对不能离开我。",
            btns:[
                {txt:"乖乖顺从",to:"talkA",pop:"❤️ 听话才会被疼爱"},
                {txt:"继续逃跑",to:"angryA",pop:"⚠️ 你会付出代价"},
                {txt:"低头认错",to:"shyB",pop:"❤️ 认错我就原谅你"},
                {txt:"想要自由",to:"angryA",pop:"⚠️ 在我身边就是最好的归宿"}
            ]
        },
        shyB:{
            title:"温柔宠溺",
            text:"她满眼宠溺地看着你，语气轻柔，只想把你好好护在身边。",
            btns:[
                {txt:"安心靠近",to:"talkA",pop:"❤️ 就这样陪着我"},
                {txt:"轻声回应",to:"chatA",pop:"❤️ 你的声音好温柔"},
                {txt:"有些害怕",to:"coldA",pop:"⚠️ 我不会伤害你"},
                {txt:"静静陪伴",to:"meet1",pop:"❤️ 这样就足够了"}
            ]
        },
        angryA:{
            title:"偏执爆发",
            text:"你的冷漠彻底激怒了她，爱意变成疯狂的占有，她不会再让你离开。",
            btns:[
                {txt:"立刻服软",to:"shyB",pop:"❤️ 早这样不就好了"},
                {txt:"依旧强硬",to:"coldB",pop:"⚠️ 那我只能困住你"},
                {txt:"沉默低头",to:"coldA",pop:"⚠️ 伤害已经造成了"},
                {txt:"重新开始",to:"start",pop:"🩹 一切回到最初"}
            ]
        }
    };

    // 弹窗
    function showPop(txt){
        document.getElementById("ptext").innerText = txt;
        document.getElementById("popup").classList.add("show");
    }
    function closePop(){
        document.getElementById("popup").classList.remove("show");
        if(wait){
            now = wait;
            wait = null;
            load();
        }
    }

    // 跳转场景
    function go(to,pop){
        if(pop){
            wait = to;
            showPop(pop);
        }else{
            now = to;
            load();
        }
    }

    // 加载界面
    function load(){
        let s = story[now];
        document.getElementById("gtitle").innerText = s.title;
        document.getElementById("gtext").innerText = s.text;
        let box = document.getElementById("gbtns");
        box.innerHTML = "";
        s.btns.forEach(b=>{
            let btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = b.txt;
            btn.onclick = ()=>{go(b.to, b.pop);};
            box.appendChild(btn);
        });
    }

    // 启动游戏
    function startGame(){
        load();
    }
</script>
</body>
</html>
